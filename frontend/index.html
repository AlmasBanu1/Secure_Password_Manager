<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Password Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ==================================================
             Header
        ================================================== -->

        <header class="page-header">

            <h1>Secure Password Manager</h1>

            <p class="subtitle">
                Generate, store and manage your passwords
            </p>

        </header>


        <!-- ==================================================
             Password Input Section
        ================================================== -->

        <section class="password-section">

            <h2>Password</h2>

            <!-- Password Label -->

            <label for="passwordInput">
                Enter Password
            </label>

            <!-- Password Input + Show Button -->

            <div class="password-input-group">

                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter or generate a password"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="visibilityButton"
                    class="visibility-button"
                >
                    Show
                </button>

            </div>

            <!-- Generate + Add Buttons -->

            <div class="button-group">

                <button
                    type="button"
                    id="generateButton"
                >
                    Generate Password
                </button>

                <button
                    type="button"
                    id="addButton"
                >
                    Add Password
                </button>

            </div>

        </section>

        <!-- ==================================================
             Search Section
        ================================================== -->

        <section class="search-section">

            <h2>Search</h2>

            <label for="searchInput">
                Search Stored Password
            </label>

            <div class="search-group">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter password to search"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="searchButton"
                >
                    Search
                </button>

            </div>

        </section>

        <!-- ==================================================
             Password List Section
        ================================================== -->

        <section class="password-list-section">

            <!-- Section Heading + Password Count -->

            <div class="section-header">

                <h2>Stored Passwords</h2>

                <span
                    id="passwordCount"
                    class="password-count"
                >
                    0
                </span>

            </div>

            <!-- Passwords will be inserted here -->

            <ul id="passwordList">

                <!-- Password items are generated by JavaScript -->

            </ul>

        </section>

        <!-- ==================================================
             Footer
        ================================================== -->

        <footer class="page-footer">

            <p>
                Secure Password Manager
            </p>

        </footer>

    </div>

    <!-- ==================================================
         JavaScript
    ================================================== -->

    <script src="script.js"></script>

</body>

</html>
