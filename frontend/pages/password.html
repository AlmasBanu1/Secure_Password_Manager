<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure Password Manager - Generate and Add Passwords"
    >

    <title>
        Passwords | Secure Password Manager
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <main class="container">


        <!-- ==================================================
             Page Header
             ================================================== -->

        <header class="page-header">

            <h1>
                Secure Password Manager
            </h1>

            <p class="subtitle">
                Generate and securely store passwords
            </p>

        </header>


        <!-- ==================================================
             Navigation / Page Actions
             ================================================== -->

        <section class="auth-section">

            <div class="auth-header">

                <div>

                    <h2>
                        Password Generator
                    </h2>

                    <p class="auth-subtitle">
                        Create a strong password and add it to your vault.
                    </p>

                </div>

            </div>


            <div class="button-group">

                <button
                    type="button"
                    id="backToDashboardButton"
                >
                    Dashboard
                </button>


                <button
                    type="button"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </section>


        <!-- ==================================================
             Message Area
             ================================================== -->

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- ==================================================
             Password Generator Section
             ================================================== -->

        <section
            class="password-section"
            aria-labelledby="passwordHeading"
        >

            <h2 id="passwordHeading">
                Create Password
            </h2>


            <!-- ==================================================
                 Password Input
                 ================================================== -->

            <div class="form-group">

                <label for="passwordInput">
                    Password
                </label>


                <div class="password-input-group">

                    <input
                        type="password"
                        id="passwordInput"
                        name="password"
                        placeholder="Enter or generate a password"
                        autocomplete="new-password"
                    >


                    <!-- Custom browser-independent eye -->

                    <button
                        type="button"
                        id="passwordVisibilityButton"
                        class="password-visibility-button"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-6 10-6
                                   10 6 10 6
                                   -3.5 6-10 6
                                   -10-6-10-6Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- ==================================================
                 Password Strength
                 ================================================== -->

            <div class="security-hint">

                <p>
                    Use a strong password containing a combination
                    of uppercase letters, lowercase letters,
                    numbers and special characters.
                </p>

            </div>


            <!-- ==================================================
                 Password Actions
                 ================================================== -->

            <div class="button-group">

                <button
                    type="button"
                    id="generateButton"
                >
                    Generate Password
                </button>


                <button
                    type="button"
                    id="addButton"
                >
                    Add Password
                </button>

            </div>

        </section>


        <!-- ==================================================
             Footer
             ================================================== -->

        <footer class="page-footer">

            <p>
                Secure Password Manager
            </p>

        </footer>

    </main>


    <!-- ======================================================
         Password Page JavaScript
         ====================================================== -->

    <script
        type="module"
        src="../js/password-page.js"
    ></script>

</body>

</html>
