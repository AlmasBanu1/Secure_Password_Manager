<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure Password Manager - Login and Registration"
    >

    <title>Secure Password Manager</title>

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <!-- ======================================================
         Main Container
         ====================================================== -->

    <main class="container">


        <!-- ==================================================
             Page Header
             ================================================== -->

        <header class="page-header">

            <h1>
                Secure Password Manager
            </h1>

            <p class="subtitle">
                Securely manage your passwords
            </p>

        </header>


        <!-- ==================================================
             Authentication Section
             ================================================== -->

        <section
            class="auth-section"
            aria-labelledby="accountHeading"
        >

            <!-- Authentication Header -->

            <div class="auth-header">

                <div>

                    <h2 id="accountHeading">
                        Account
                    </h2>

                    <p class="auth-subtitle">
                        Register or login to manage your passwords securely.
                    </p>

                </div>

            </div>


            <!-- ==================================================
                 Username
                 ================================================== -->

            <div class="form-group">

                <label for="usernameInput">
                    Username
                </label>

                <input
                    type="text"
                    id="usernameInput"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- ==================================================
                 Master Password
                 ================================================== -->

            <div class="form-group">

                <label for="masterPasswordInput">
                    Master Password
                </label>


                <div class="password-input-group">

                    <input
                        type="password"
                        id="masterPasswordInput"
                        name="masterPassword"
                        placeholder="Enter master password"
                        autocomplete="current-password"
                        required
                    >


                    <!-- Custom browser-independent eye button -->

                    <button
                        type="button"
                        id="masterPasswordVisibilityButton"
                        class="password-visibility-button"
                        aria-label="Show master password"
                        title="Show password"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-6 10-6
                                   10 6 10 6
                                   -3.5 6-10 6
                                   -10-6-10-6Z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                        </svg>

                    </button>

                </div>


                <!-- Security explanation -->

                <p class="security-hint">
                    Your master password is used to authenticate your account.
                </p>

            </div>


            <!-- ==================================================
                 Authentication Actions
                 ================================================== -->

            <div class="button-group">

                <button
                    type="button"
                    id="registerButton"
                >
                    Register
                </button>


                <button
                    type="button"
                    id="loginButton"
                >
                    Login
                </button>

            </div>

        </section>


        <!-- ==================================================
             Message Area
             ================================================== -->

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- ==================================================
             Footer
             ================================================== -->

        <footer class="page-footer">

            <p>
                Secure Password Manager
            </p>

        </footer>

    </main>


    <!-- ======================================================
         Application JavaScript
         ====================================================== -->

    <script
        type="module"
        src="../js/app.js"
    ></script>

</body>

</html>
